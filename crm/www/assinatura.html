<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Assinatura da proposta</title>
<link rel="icon" href="{{ favicon }}">
<link rel="apple-touch-icon" href="{{ favicon }}">
<style>
  :root {
    --brand: #042d3c;
    --sage: #8aa1a9;
    --glow: rgba(15, 70, 85, 0.55);
    --glow-soft: rgba(4, 45, 60, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: #04080a; }
  body {
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse 70% 55% at 50% 0%, var(--glow) 0%, var(--glow-soft) 45%, transparent 75%),
      radial-gradient(ellipse 60% 50% at 85% 100%, rgba(138, 161, 169, 0.10) 0%, transparent 70%),
      #04080a;
    background-attachment: fixed;
  }
  .shell { display: flex; min-height: 100vh; min-height: 100dvh; width: 100%; }
  .panel { flex: 1 1 100%; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

  .card {
    width: 100%; max-width: 440px;
    background: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 28px;
    padding: 2.5rem 2.25rem 2.25rem;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(110px);
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(110px); } to { opacity: 1; transform: translateY(0); } }

  .head { text-align: center; padding-bottom: 1.5rem; }
  .logo { margin: 0 auto 1.1rem; display: flex; align-items: center; justify-content: center; }
  .logo img { height: 120px; max-width: 100%; object-fit: contain; filter: brightness(0) invert(1); }
  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; margin: 0 0 0.75rem; }
  .tag { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 0.6rem; }
  .tag::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sage); margin-right: 0.5rem; vertical-align: middle; }
  .sub { font-size: 0.9rem; line-height: 1.5; color: rgba(255,255,255,0.55); margin: 0; }

  .field { margin-bottom: 0.9rem; text-align: left; }
  .field label { display: block; font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-bottom: 0.35rem; }
  .field input {
    width: 100%; height: 46px; padding: 0 0.9rem; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #fff;
    font-size: 0.92rem; outline: none;
  }
  .field input:focus { border-color: var(--sage); }
  .check { display: flex; align-items: flex-start; gap: 0.6rem; margin: 1.1rem 0 1.3rem; text-align: left; }
  .check input { margin-top: 0.2rem; }
  .check span { font-size: 0.82rem; line-height: 1.5; color: rgba(255,255,255,0.7); }

  .assinar {
    width: 100%; height: 48px; border: none; border-radius: 999px;
    background: #fff; color: #0b1a22; font-weight: 700; font-size: 0.94rem; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .assinar:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(138,161,169,0.28); }
  .assinar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .msg { font-size: 0.8rem; margin-top: 0.7rem; color: rgba(255,255,255,0.6); text-align: center; }
  .msg.err { color: #ff9c8f; }

  .ok { text-align: center; }
  .ok .circle {
    width: 64px; height: 64px; border-radius: 50%; background: rgba(126, 224, 165, 0.15);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 1.1rem;
    font-size: 2rem; color: #7ee0a5;
  }
  .ok .quando { font-size: 0.85rem; color: rgba(255,255,255,0.55); margin-top: 0.4rem; }

  .erro { text-align: center; color: rgba(255,255,255,0.75); font-size: 0.95rem; line-height: 1.5; padding: 0.5rem 0; }
  .priv { color: rgba(255,255,255,0.4); font-size: 0.74rem; line-height: 1.55; margin: 1.4rem 0.2rem 0; text-align: center; }
  .hide { display: none; }
  @media (max-width: 480px) { .card { padding: 2rem 1.4rem 1.8rem; border-radius: 24px; } .logo img { height: 96px; } h1 { font-size: 1.45rem; } }
</style>
</head>
<body>
<div class="shell"><div class="panel"><div class="card">
  <div class="head">
    <div class="logo hide" id="logoBox"><img id="logo" alt=""></div>
    <h1 id="titulo">Assinatura da proposta</h1>
    <div class="tag">Ambiente seguro</div>
    <p class="sub" id="sub">Carregando...</p>
  </div>
  <div id="erro" class="erro hide"></div>

  <div id="app" class="hide">
    <div class="field">
      <label>Nome completo</label>
      <input id="fNome" type="text" autocomplete="name">
    </div>
    <div class="field">
      <label>CPF ou CNPJ</label>
      <input id="fDoc" type="text" inputmode="numeric" autocomplete="off">
    </div>
    <div class="field">
      <label>E-mail</label>
      <input id="fEmail" type="email" autocomplete="email">
    </div>
    <label class="check">
      <input id="fAceite" type="checkbox">
      <span>Li a proposta enviada e confirmo o aceite dos termos e valores descritos nela.</span>
    </label>
    <button id="btnAssinar" class="assinar">Assinar</button>
    <div id="msg" class="msg hide"></div>
    <p class="priv">Ao assinar, registramos seu nome, e-mail, documento e o horário do aceite — isso vale como assinatura eletrônica simples do documento.</p>
  </div>

  <div id="feito" class="ok hide">
    <div class="circle">&#10003;</div>
    <div id="feitoTitulo" style="font-size:1.05rem;font-weight:600;">Proposta assinada</div>
    <div class="quando" id="feitoQuando"></div>
  </div>
</div></div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('t') || '';
  function hexRgba(hex, a) {
    var m = /^#([0-9a-f]{6})$/i.exec((hex || '').trim()); if (!m) return null;
    var n = parseInt(m[1], 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function errText(j) {
    try { var m = JSON.parse(j._server_messages || '[]'); if (m.length) return JSON.parse(m[0]).message.replace(/<[^>]+>/g, ''); } catch (e) {}
    return 'Não foi possível concluir. Tente novamente.';
  }
  function fail(msg) { $('sub').textContent = ''; $('erro').textContent = msg; $('erro').classList.remove('hide'); }
  function theme(data) {
    var root = document.documentElement.style;
    var g = hexRgba(data.cor, 0.55), s = hexRgba(data.cor, 0.18);
    if (g) { root.setProperty('--glow', g); root.setProperty('--glow-soft', s); }
    if (/^#[0-9a-f]{6}$/i.test(data.destaque || '')) root.setProperty('--sage', data.destaque);
  }
  function formatQuando(iso) {
    if (!iso) return '';
    var d = new Date((iso + '').replace(' ', 'T'));
    if (isNaN(d.getTime())) return '';
    return 'Assinado em ' + d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  function mostrarFeito(nome, quando) {
    $('app').classList.add('hide');
    $('feitoQuando').textContent = (nome ? nome + ' · ' : '') + formatQuando(quando);
    $('feito').classList.remove('hide');
  }
  function render(data) {
    theme(data);
    if (data.logo) { $('logo').src = data.logo; $('logoBox').classList.remove('hide'); }
    document.title = 'Assinatura da proposta' + (data.marca ? ' — ' + data.marca : '');
    $('titulo').textContent = data.marca ? data.marca : 'Assinatura da proposta';
    $('sub').textContent = data.cliente
      ? 'Confirme os dados abaixo para assinar a proposta de ' + data.marca + '.'
      : 'Confirme os dados abaixo para assinar a proposta.';
    if (data.assinada) { mostrarFeito(data.assinante_nome, data.assinado_em); return; }
    $('app').classList.remove('hide');
  }
  $('btnAssinar').onclick = function () {
    var nome = $('fNome').value.trim();
    var doc = $('fDoc').value.trim();
    var email = $('fEmail').value.trim();
    var msg = $('msg');
    if (!nome || nome.split(/\\s+/).length < 2) { msg.className = 'msg err'; msg.textContent = 'Informe o nome completo.'; msg.classList.remove('hide'); return; }
    if (!/^\\d{11}$|^\\d{14}$/.test(doc.replace(/\\D/g, ''))) { msg.className = 'msg err'; msg.textContent = 'Informe um CPF ou CNPJ válido.'; msg.classList.remove('hide'); return; }
    if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)) { msg.className = 'msg err'; msg.textContent = 'Informe um e-mail válido.'; msg.classList.remove('hide'); return; }
    if (!$('fAceite').checked) { msg.className = 'msg err'; msg.textContent = 'Confirme que leu e aceita os termos da proposta.'; msg.classList.remove('hide'); return; }
    $('btnAssinar').disabled = true;
    msg.className = 'msg'; msg.textContent = 'Assinando...'; msg.classList.remove('hide');
    var body = new URLSearchParams({ t: token, nome: nome, documento: doc, email: email });
    fetch('/api/method/crm.api.proposta.assinar_proposta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { msg.className = 'msg err'; msg.textContent = errText(res.j); $('btnAssinar').disabled = false; return; }
        mostrarFeito(res.j.message.assinante_nome, res.j.message.assinado_em);
      })
      .catch(function () { msg.className = 'msg err'; msg.textContent = 'Falha de conexão. Tente de novo.'; $('btnAssinar').disabled = false; });
  };
  if (!token) { fail('Link inválido. Peça um novo ao escritório.'); return; }
  fetch('/api/method/crm.api.proposta.get_public_signature?t=' + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) { if (!res.ok) fail(errText(res.j)); else render(res.j.message); })
    .catch(function () { fail('Não foi possível carregar. Tente novamente.'); });
})();
</script>
</body>
</html>

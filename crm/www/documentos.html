<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Envio de documentos</title>
<style>
  :root {
    --brand: #042d3c;
    --sage: #8aa1a9;
    --glow: rgba(15, 70, 85, 0.55);
    --glow-soft: rgba(4, 45, 60, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: #04080a; }
  body {
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse 70% 55% at 50% 0%, var(--glow) 0%, var(--glow-soft) 45%, transparent 75%),
      radial-gradient(ellipse 60% 50% at 85% 100%, rgba(138, 161, 169, 0.10) 0%, transparent 70%),
      #04080a;
    background-attachment: fixed;
  }
  .shell { display: flex; min-height: 100vh; min-height: 100dvh; width: 100%; }
  .panel { flex: 1 1 100%; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

  .card {
    width: 100%; max-width: 440px;
    background: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 28px;
    padding: 2.5rem 2.25rem 2.25rem;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(110px);
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(110px); } to { opacity: 1; transform: translateY(0); } }

  .head { text-align: center; padding-bottom: 1.5rem; }
  .logo { margin: 0 auto 1.1rem; display: flex; align-items: center; justify-content: center; }
  .logo img { height: 120px; max-width: 100%; object-fit: contain; filter: brightness(0) invert(1); }
  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; margin: 0 0 0.75rem; }
  .tag { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 0.6rem; }
  .tag::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sage); margin-right: 0.5rem; vertical-align: middle; }
  .sub { font-size: 0.9rem; line-height: 1.5; color: rgba(255,255,255,0.55); margin: 0; }

  .note { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; padding: 0.9rem 1.1rem; font-size: 0.88rem; line-height: 1.5; color: rgba(255,255,255,0.75); margin-bottom: 1rem; }

  .item { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09); border-radius: 20px; padding: 0.95rem 1.1rem; margin-bottom: 0.7rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; }
  .name { font-weight: 600; font-size: 0.95rem; color: #fff; }
  .state { font-size: 0.78rem; color: rgba(255,255,255,0.5); margin-top: 0.15rem; }
  .state.ok { color: #7ee0a5; }
  .pick {
    display: inline-flex; align-items: center; justify-content: center; height: 42px; padding: 0 1.3rem;
    background: #fff; color: #0b1a22; border-radius: 999px; font-weight: 700; font-size: 0.88rem; cursor: pointer; white-space: nowrap;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pick:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(138,161,169,0.28); }
  .pick input { display: none; }
  .msg { font-size: 0.8rem; margin-top: 0.6rem; color: rgba(255,255,255,0.6); }
  .msg.err { color: #ff9c8f; }
  .bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,0.1); margin-top: 0.6rem; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--sage); transition: width .25s ease; }

  .erro { text-align: center; color: rgba(255,255,255,0.75); font-size: 0.95rem; line-height: 1.5; padding: 0.5rem 0; }
  .priv { color: rgba(255,255,255,0.4); font-size: 0.74rem; line-height: 1.55; margin: 1.4rem 0.2rem 0; text-align: center; }
  .hide { display: none; }
  @media (max-width: 480px) { .card { padding: 2rem 1.4rem 1.8rem; border-radius: 24px; } .logo img { height: 96px; } h1 { font-size: 1.45rem; } }
</style>
</head>
<body>
<div class="shell"><div class="panel"><div class="card">
  <div class="head">
    <div class="logo hide" id="logoBox"><img id="logo" alt=""></div>
    <h1 id="titulo">Envio de documentos</h1>
    <div class="tag">Ambiente seguro</div>
    <p class="sub" id="sub">Carregando...</p>
  </div>
  <div id="erro" class="erro hide"></div>
  <div id="app" class="hide">
    <div id="nota" class="note hide"></div>
    <div id="lista"></div>
    <p class="priv">Seus arquivos são enviados de forma segura e ficam guardados apenas na pasta do seu atendimento, acessível somente à equipe do escritório. Aceitamos PDF e fotos (JPG, PNG, HEIC), até 15 MB cada.</p>
  </div>
</div></div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('t') || '';
  function hexRgba(hex, a) {
    var m = /^#([0-9a-f]{6})$/i.exec((hex || '').trim()); if (!m) return null;
    var n = parseInt(m[1], 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function errText(j) {
    try { var m = JSON.parse(j._server_messages || '[]'); if (m.length) return JSON.parse(m[0]).message.replace(/<[^>]+>/g, ''); } catch (e) {}
    return 'Não foi possível concluir. Tente novamente.';
  }
  function fail(msg) { $('sub').textContent = ''; $('erro').textContent = msg; $('erro').classList.remove('hide'); }
  function theme(data) {
    var root = document.documentElement.style;
    var g = hexRgba(data.cor, 0.55), s = hexRgba(data.cor, 0.18);
    if (g) { root.setProperty('--glow', g); root.setProperty('--glow-soft', s); }
    if (/^#[0-9a-f]{6}$/i.test(data.destaque || '')) root.setProperty('--sage', data.destaque);
  }
  function render(data) {
    theme(data);
    if (data.logo) { $('logo').src = data.logo; $('logoBox').classList.remove('hide'); }
    document.title = 'Envio de documentos' + (data.marca ? ' — ' + data.marca : '');
    $('titulo').textContent = data.marca ? data.marca : 'Envio de documentos';
    $('sub').textContent = 'Olá' + (data.nome ? ', ' + data.nome : '') + '! Toque em "Enviar" em cada documento e escolha a foto ou o arquivo. Pode tirar a foto na hora.';
    if (data.mensagem) { $('nota').textContent = data.mensagem; $('nota').classList.remove('hide'); }
    var box = $('lista'); box.innerHTML = '';
    data.itens.forEach(function (it) { box.appendChild(card(it)); });
    $('app').classList.remove('hide');
  }
  function card(it) {
    var c = document.createElement('div'); c.className = 'item';
    var row = document.createElement('div'); row.className = 'row';
    var left = document.createElement('div');
    var n = document.createElement('div'); n.className = 'name'; n.textContent = it.nome;
    var s = document.createElement('div'); s.className = 'state';
    function setState(count) { s.textContent = count ? '✓ ' + count + (count > 1 ? ' arquivos enviados' : ' arquivo enviado') : 'Ainda não enviado'; s.className = 'state' + (count ? ' ok' : ''); }
    setState(it.enviados);
    left.appendChild(n); left.appendChild(s);
    var label = document.createElement('label'); label.className = 'pick';
    label.appendChild(document.createTextNode(it.enviados ? 'Enviar mais' : 'Enviar'));
    var input = document.createElement('input'); input.type = 'file'; input.multiple = true; input.accept = 'image/*,application/pdf,.heic,.doc,.docx';
    label.appendChild(input);
    row.appendChild(left); row.appendChild(label); c.appendChild(row);
    var msg = document.createElement('div'); msg.className = 'msg hide'; c.appendChild(msg);
    var bar = document.createElement('div'); bar.className = 'bar hide'; var fill = document.createElement('i'); bar.appendChild(fill); c.appendChild(bar);
    var count = it.enviados;
    input.onchange = function () {
      var files = Array.prototype.slice.call(input.files); input.value = '';
      msg.className = 'msg'; msg.textContent = 'Enviando...'; bar.classList.remove('hide'); fill.style.width = '4%';
      (function next(i) {
        if (i >= files.length) { msg.classList.add('hide'); bar.classList.add('hide'); label.firstChild.nodeValue = 'Enviar mais'; return; }
        var fd = new FormData(); fd.append('file', files[i]); fd.append('t', token); fd.append('item', it.nome);
        fetch('/api/method/crm.api.clientes.upload_public_document', { method: 'POST', body: fd })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok) { msg.className = 'msg err'; msg.textContent = errText(res.j); bar.classList.add('hide'); return; }
            count = res.j.message.enviados; setState(count);
            fill.style.width = Math.round(((i + 1) / files.length) * 100) + '%';
            msg.textContent = 'Enviando... (' + (i + 1) + ' de ' + files.length + ')';
            next(i + 1);
          })
          .catch(function () { msg.className = 'msg err'; msg.textContent = 'Falha de conexão. Tente de novo.'; bar.classList.add('hide'); });
      })(0);
    };
    return c;
  }
  if (!token) { fail('Link inválido. Peça um novo ao escritório.'); return; }
  fetch('/api/method/crm.api.clientes.get_public_request?t=' + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) { if (!res.ok) fail(errText(res.j)); else render(res.j.message); })
    .catch(function () { fail('Não foi possível carregar. Tente novamente.'); });
})();
</script>
</body>
</html>
